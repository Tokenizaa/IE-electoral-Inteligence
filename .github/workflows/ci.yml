name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Phase 3 data and methodology safeguards
        run: bun run test:phase3

      - name: TSE Open Data catalog and download safeguards
        run: bun run test:tse-open-data

      - name: TSE versioned layout validation safeguards
        run: bun run test:tse-layout

      - name: TSE object storage adapter safeguards
        run: bun run test:tse-storage

      - name: TSE secure ZIP reader safeguards
        run: bun run test:tse-zip

      - name: TSE selective streaming reader safeguards
        run: bun run test:tse-select
